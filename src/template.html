<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המדף · ספריית מודלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6a13'/%3E%3Cpath d='M14 44h36M18 36h28M22 28h20M26 20h12' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --panel2:#faf9f6; --line:#e6e2da; --line2:#d8d3c8;
  --ink:#1d1c1a; --ink2:#5c5850; --ink3:#8f897d;
  --accent:#ff6a13; --accent-ink:#ffffff; --accent-soft:#fff0e6;
  --ok:#1f9d55; --ok-soft:#e5f6ec; --fail:#d93636; --fail-soft:#fde9e9; --part:#c98a00; --part-soft:#fdf3d8;
  --thumb-bg: radial-gradient(120% 100% at 50% 20%, #ffffff 0%, #ece8e1 100%);
  --plate-major:#b9b2a5; --plate-minor:#ddd7cc; --plate-fill:#efebe4;
  --shadow: 0 1px 2px rgba(30,25,15,.06), 0 4px 14px rgba(30,25,15,.06);
  --radius:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --panel:#1d1d1b; --panel2:#232321; --line:#2e2d2a; --line2:#3a3935;
    --ink:#f1efe9; --ink2:#b9b5ab; --ink3:#87837a;
    --accent:#ff7a2b; --accent-ink:#1a0d04; --accent-soft:#3a2214;
    --ok:#3ccf7d; --ok-soft:#163223; --fail:#ff6b6b; --fail-soft:#3a1c1c; --part:#f0b429; --part-soft:#3a2f12;
    --thumb-bg: radial-gradient(120% 100% at 50% 20%, #34332f 0%, #20201e 100%);
    --plate-major:#5a574f; --plate-minor:#36352f; --plate-fill:#262522;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1d1b; --panel2:#232321; --line:#2e2d2a; --line2:#3a3935;
  --ink:#f1efe9; --ink2:#b9b5ab; --ink3:#87837a;
  --accent:#ff7a2b; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --ok:#3ccf7d; --ok-soft:#163223; --fail:#ff6b6b; --fail-soft:#3a1c1c; --part:#f0b429; --part-soft:#3a2f12;
  --thumb-bg: radial-gradient(120% 100% at 50% 20%, #34332f 0%, #20201e 100%);
  --plate-major:#5a574f; --plate-minor:#36352f; --plate-fill:#262522;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body,#root{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Rubik,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;direction:ltr;unicode-bidi:embed}
.ltr{direction:ltr;unicode-bidi:embed}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 12px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2);border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.small{padding:4px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--fail)}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}

/* welcome */
#welcome{min-height:100%;display:grid;place-items:center;padding:24px}
.welcome-card{max-width:560px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:20px;height:20px}
.welcome-card h1{font-size:34px;line-height:1.15;margin:26px 0 12px;letter-spacing:-.02em}
.welcome-card p{color:var(--ink2);font-size:16px;margin:0 0 26px}
.welcome-actions{display:flex;flex-direction:column;gap:10px;align-items:center}
.welcome-actions .btn{font-size:15px;padding:11px 20px}
.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:38px;text-align:start}
.feature{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.feature b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px;font-size:14px}
.notice{background:var(--fail-soft);color:var(--fail);border-radius:10px;padding:12px 14px;margin-top:16px}

/* app layout */
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:240px minmax(0,1fr)}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:8px 36px 8px 12px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3)}
.search kbd{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.top .spacer{flex:1}
.folder-chip{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-chip svg{width:15px;height:15px;flex:none}
select.sel{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 10px}

aside.side{border-inline-end:1px solid var(--line);padding:14px 10px;overflow:auto;background:var(--panel)}
.side h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:18px 8px 6px;font-weight:600}
.side h4:first-child{margin-top:4px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:8px;padding:6px 8px;text-align:start;color:var(--ink2)}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--ink);font-weight:500}
.nav-item .count{margin-inline-start:auto;font-size:12px;color:var(--ink3)}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.8}
.nav-item span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 4px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-weight:600;line-height:1.1}
.stat span{font-size:11px;color:var(--ink3)}

main{overflow:auto;position:relative}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 20px 4px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.toolbar .title{font-size:18px;font-weight:600;color:var(--ink);margin-inline-end:4px}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.progress .bar{width:120px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:12px 20px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s,border-color .12s;content-visibility:auto;contain-intrinsic-size:260px}
.card:hover{box-shadow:var(--shadow);border-color:var(--line2);transform:translateY(-1px)}
.card.selected{outline:2px solid var(--accent);outline-offset:-2px}
.thumb{aspect-ratio:1/1;background:var(--thumb-bg);display:grid;place-items:center;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;padding:8px}
.thumb .ph{color:var(--ink3);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.thumb .ph svg{width:34px;height:34px;opacity:.5}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card .badges{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink2)}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.card .check{position:absolute;top:8px;inset-inline-end:8px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:var(--panel);display:grid;place-items:center;opacity:0;transition:opacity .12s}
.card:hover .check,.card.selected .check,.grid.selecting .check{opacity:1}
.card.selected .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card .check svg{width:13px;height:13px}
.thumbwrap{position:relative}
.card .quick{position:absolute;inset-inline-start:8px;bottom:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.card:hover .quick{opacity:1}
.grid.selecting .quick{display:none}
.card .quick button{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.card .quick button svg{width:12px;height:12px}
.card .quick button[data-q="ok"]:hover{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.card .quick button[data-q="fail"]:hover{background:var(--fail-soft);color:var(--fail);border-color:var(--fail)}
.card .fav{position:absolute;bottom:8px;inset-inline-end:8px;color:var(--accent);width:18px;height:18px}
.card .body{padding:9px 11px 11px}
.card .name{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;margin-top:3px;min-height:18px}
.card .sub .st{display:inline-flex;align-items:center;gap:4px}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:20px;background:hsl(var(--h) 70% 50% / .14);color:hsl(var(--h) 55% 38%);font-weight:500}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:hsl(var(--h) 75% 72%)}}
:root[data-theme="dark"] .tag{color:hsl(var(--h) 75% 72%)}
.tag button{border:0;background:transparent;padding:0;line-height:1;color:inherit;opacity:.6;font-size:14px}
.tag button:hover{opacity:1}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sdot.ok{background:var(--ok)}.sdot.fail{background:var(--fail)}.sdot.partial{background:var(--part)}.sdot.never{background:var(--line2)}

.empty{padding:70px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:4px}

.bulkbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30}
.bulkbar .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
.bulkbar .btn:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.bulkbar .n{font-weight:600;padding:0 6px}

.dropzone{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 12%,transparent);border:3px dashed var(--accent);z-index:60;display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--accent);pointer-events:none}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(10,8,5,.45);z-index:40;display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border-radius:18px;width:min(1240px,100%);height:min(820px,100%);display:grid;grid-template-columns:1fr 420px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .stage{position:relative;background:var(--thumb-bg);min-height:0}
.modal .stage canvas{display:block;width:100%;height:100%}
.stage .overlay{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);text-align:center;padding:20px}
.stage .tools{position:absolute;bottom:14px;right:14px;display:flex;gap:6px}
.stage .tools .btn{background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px)}
.stage .dims{position:absolute;top:14px;right:14px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink2)}
.stage .plates{position:absolute;bottom:14px;left:14px;right:180px;display:flex;gap:6px;flex-wrap:wrap}
.stage .plates .btn{background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px)}
.stage .plates .btn.on{border-color:var(--accent);background:var(--accent-soft)}
.stage .nav{position:absolute;top:14px;left:14px;display:flex;gap:6px}
.stage .nav .btn{background:color-mix(in srgb,var(--panel) 85%,transparent)}
.info{display:flex;flex-direction:column;min-height:0;border-inline-start:1px solid var(--line)}
.info-head{padding:16px 18px 0}
.info-head .row{display:flex;align-items:flex-start;gap:8px}
.name-input{flex:1;font-size:20px;font-weight:600;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;margin:-2px -6px;outline:none;min-width:0}
.name-input:hover{border-color:var(--line)}
.name-input:focus{border-color:var(--accent);background:var(--panel2)}
.info-head .path{color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:6px;overflow:hidden}
.info-head .path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:12px 14px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 10px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:500;margin-bottom:-1px}
.tab.active{color:var(--ink);border-color:var(--accent)}
.tab .c{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-inline-start:4px;color:var(--ink3)}
.info-body{flex:1;overflow:auto;padding:16px 18px 24px}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12px;color:var(--ink3);margin-bottom:5px;font-weight:500}
.tag-editor{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:6px;background:var(--panel2)}
.tag-editor input{border:0;outline:0;background:transparent;flex:1;min-width:90px;padding:2px 4px}
textarea.notes,.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--panel2);outline:none;resize:vertical}
textarea.notes:focus,.inp:focus{border-color:var(--accent);background:var(--panel)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;color:var(--ink)}
.fil{display:inline-flex;align-items:center;gap:4px;margin-inline-end:10px}
.section-title{font-size:12px;font-weight:600;color:var(--ink3);margin:20px 0 8px;letter-spacing:.03em}
.swatch{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.15);vertical-align:-1px}

.plate-sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{font-size:12.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.pchip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pchip.fail{background:var(--fail-soft);color:var(--fail);border-color:transparent}
.pchip.partial{background:var(--part-soft);color:var(--part);border-color:transparent}
.print-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.print-item .ph{display:flex;align-items:center;gap:8px}
.print-item .ph .when{font-weight:600}
.print-item .ph .x{margin-inline-start:auto}
.print-item .meta{color:var(--ink2);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.print-item .pn{margin-top:6px;font-size:13px;white-space:pre-wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.fail{background:var(--fail-soft);color:var(--fail)}.pill.partial{background:var(--part-soft);color:var(--part)}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:7px 6px;font-weight:500;color:var(--ink2)}
.seg button+button{border-inline-start:1px solid var(--line2)}
.seg button.on[data-v="ok"]{background:var(--ok-soft);color:var(--ok)}
.seg button.on[data-v="partial"]{background:var(--part-soft);color:var(--part)}
.seg button.on[data-v="fail"]{background:var(--fail-soft);color:var(--fail)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px}
.print-form{border:1px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--panel)}
.print-form .actions{display:flex;gap:8px;justify-content:flex-start;margin-top:12px}
.autofill{font-size:12px;color:var(--ink3);margin-top:8px;display:flex;align-items:center;gap:6px}

.ver{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
.ver:hover{border-color:var(--line2)}
.ver.viewing{border-color:var(--accent)}
.ver img,.ver .vt{width:54px;height:54px;border-radius:8px;background:var(--thumb-bg);object-fit:contain;flex:none}
.ver .vt img{width:100%;height:100%;object-fit:contain}
.ver .vt .ph svg{width:22px;height:22px}.ver .vt .ph span{display:none}.ver .vt{display:grid;place-items:center}
.ver .vi{flex:1;min-width:0}
.ver .vn{font-weight:600;display:flex;align-items:center;gap:6px}
.ver .vp{color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver input{width:100%;border:0;border-bottom:1px dashed var(--line2);background:transparent;font-size:12.5px;padding:2px 0;outline:none;color:var(--ink2)}
.ver .va{display:flex;flex-direction:column;gap:4px}
.hint{font-size:12.5px;color:var(--ink3);margin:6px 0 12px}

.ppill{max-width:340px;overflow:hidden}
.ppill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--line2)}
.pdot.run{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.pdot.idle{background:var(--ok)}.pdot.bad{background:var(--fail)}.pdot.off{background:var(--ink3)}
.dialog .box.wide{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto}
.pstatus{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.steps{padding-inline-start:20px;margin:10px 0;display:flex;flex-direction:column;gap:12px}
.code{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;margin-top:6px}
.code code{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow:auto;white-space:nowrap;text-align:left}
details.setup summary{cursor:pointer;font-weight:600;margin:6px 0}
.ostabs{display:flex;gap:6px;margin:8px 0}
.ostabs .btn.on{border-color:var(--accent);background:var(--accent-soft)}
.inbox{display:flex;flex-direction:column;gap:8px}
.inbox-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.irow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.icover{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--thumb-bg);flex:none}
.ii{flex:1;min-width:0}
.it{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isub{font-size:12.5px;color:var(--ink3)}
.pmlist{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:50vh;overflow:auto}
.pmi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px;text-align:start}
.pmi:hover{border-color:var(--accent)}
.pmi img,.pmt{width:40px;height:40px;border-radius:6px;object-fit:contain;background:var(--thumb-bg);flex:none}
.pmn{font-weight:600}
.pmp{margin-inline-start:auto;color:var(--ink3);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.irow{flex-wrap:wrap}.ppill span:last-child{display:none}}
.settings .seg.modes button.on{background:var(--accent-soft);color:var(--ink)}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.acct span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.printer-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.pr-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pr-head svg{width:16px;height:16px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:360px;font-size:13.5px;animation:tin .2s ease}
.toast.err{background:var(--fail);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

.dialog{position:fixed;inset:0;background:rgba(10,8,5,.45);z-index:70;display:grid;place-items:center;padding:20px}
.dialog .box{background:var(--panel);border-radius:16px;padding:20px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dialog h3{margin:0 0 8px;font-size:17px}
.dialog p{color:var(--ink2);margin:0 0 16px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}

@media (max-width: 980px){
  .modal{grid-template-columns:1fr;grid-template-rows:42% 1fr;height:100%}
  .info{border-inline-start:0;border-top:1px solid var(--line)}
}
@media (max-width: 760px){
  #app{grid-template-columns:minmax(0,1fr)}
  aside.side{display:none}
  header.top{gap:6px;padding:8px 10px}
  header.top .logo{font-size:0;gap:0}
  header.top .btn span{display:none}
  .search kbd{display:none}
  .toolbar{padding:12px 16px 4px}
  .feature-row{grid-template-columns:1fr}
  .folder-chip{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding:12px 16px 40px;gap:10px}
  .modal-wrap{padding:0}
  .modal{border-radius:0}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script>/*APP*/</script>
</body>
</html>
