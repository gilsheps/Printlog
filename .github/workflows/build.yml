name: Build app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the installers'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
            label: mac-arm64
          - os: macos-latest
            target: --mac --x64
            label: mac-x64
          - os: windows-latest
            target: --win
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run app:prepare
      - name: Google Drive OAuth client (from repository secrets)
        shell: bash
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GID" ]; then
            node -e "require('fs').writeFileSync('app/oauth.json', JSON.stringify({ client_id: process.env.GID, client_secret: process.env.GSECRET || '' }))"
            echo "Google Drive archive: enabled"
          else
            echo "::notice::GOOGLE_CLIENT_ID secret not set - the Google Drive archive will be disabled in this build"
          fi
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log || {
            tail -n 40 build.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: PrintLog-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PrintLog $TAG" --generate-notes
          fi
      # Public copy of the release, so installed apps can see and download updates
      # (needs the RELEASES_TOKEN secret: a token with write access to gilsheps/gilsheps-printlog-releases)
      - name: Publish to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          PUB: gilsheps/gilsheps-printlog-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::RELEASES_TOKEN not set, skipping the public releases repo"; exit 0; fi
          git log -1 --format=%B > notes.txt
          if gh release view "$TAG" --repo "$PUB" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$PUB"
          else
            gh release create "$TAG" out/* --repo "$PUB" --title "PrintLog $TAG" --notes-file notes.txt --latest
          fi
