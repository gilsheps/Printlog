name: Build app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the installers'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
            label: mac-arm64
          - os: macos-latest
            target: --mac --x64
            label: mac-x64
          - os: windows-latest
            target: --win
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run app:prepare
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log || {
            tail -n 40 build.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ModelShelf-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Model Shelf ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
